<button mat-icon-button [matMenuTriggerFor]="menu" [matTooltip]="'Notifikacije'">
  <mat-icon [matBadge]="unreadCount() > 0 ? unreadCount() : null" matBadgeColor="warn" matBadgeSize="small">
    notifications
  </mat-icon>
</button>

<mat-menu #menu="matMenu">
  @if (notifications().length === 0) {
  <div class="empty-state">Nema notifikacija</div>
  } @else {
  <div class="notification-list">
    @for (n of notifications(); track n.id) {
    <div class="notification-item" [class.unread]="!n.isRead" (click)="onNotificationClick(n.id)">
      <div class="notification-text">
        <span>{{ n.message }}</span>
        <span class="notification-date">{{ n.createdAt | date: 'short' }}</span>
      </div>
      <button mat-icon-button class="delete-btn" [matTooltip]="'Obriši'" (click)="onDelete($event, n.id)">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    }
  </div>
  <button mat-menu-item class="clear-all-btn" (click)="onClearAll()">
    <mat-icon>delete_sweep</mat-icon>
    <span>Očisti notifikacije</span>
  </button>
  }
</mat-menu>
