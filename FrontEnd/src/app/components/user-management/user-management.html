<!-- src/app/components/user-management/user-management.html -->
<div class="container mt-5">
  <div class="header-row">
    <h1>User Management</h1>
    <button mat-button (click)="goBack()">Back to Tasks</button>
  </div>

  <table mat-table [dataSource]="usersResource.value()" class="mat-elevation-z8">

    <ng-container matColumnDef="fullName">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let user"> {{ user.fullName }} </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let user"> {{ user.email }} </td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef> Role </th>
      <td mat-cell *matCellDef="let user">
        @if (user.id === currentUserId()) {
        <span>{{ user.roles[0] }} (you)</span>
        } @else {
        <mat-form-field appearance="outline" class="role-select">
          <mat-select [ngModel]="user.roles[0]" (ngModelChange)="onRoleChange(user.id, $event)">
            @for (role of availableRoles; track role) {
            <mat-option [value]="role">{{ role }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
</div>
