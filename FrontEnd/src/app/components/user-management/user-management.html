<div class="dialog-header">
  <mat-icon class="header-icon">manage_accounts</mat-icon>
  <h2 mat-dialog-title>Upravljanje korisnicima</h2>
</div>

<mat-dialog-content class="user-management-content">
  <table mat-table [dataSource]="usersResource.value()" class="users-table">

    <ng-container matColumnDef="fullName">
      <th mat-header-cell *matHeaderCellDef> Ime </th>
      <td mat-cell *matCellDef="let user"> {{ user.fullName }} </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let user"> {{ user.email }} </td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef> Rola </th>
      <td mat-cell *matCellDef="let user">
        @if (user.id === currentUserId()) {
        <span class="role-badge you">{{ user.roles[0] }} (vi)</span>
        } @else {
        <mat-form-field appearance="outline" class="role-select">
          <mat-select [ngModel]="user.roles[0]" (ngModelChange)="onRoleChange(user.id, $event)">
            @for (role of availableRoles; track role) {
            <mat-option [value]="role">{{ role }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="password">
      <th mat-header-cell *matHeaderCellDef> Lozinka </th>
      <td mat-cell *matCellDef="let user">
        <button mat-icon-button (click)="openResetPassword(user)" [matTooltip]="'Resetuj lozinku'">
          <mat-icon>vpn_key</mat-icon>
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let user">
        @if (user.id !== currentUserId()) {
        <button mat-icon-button class="btn-delete" (click)="deleteUser(user)" [matTooltip]="'Obriši korisnika'">
          <mat-icon>delete</mat-icon>
        </button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="close()">Zatvori</button>
</mat-dialog-actions>
