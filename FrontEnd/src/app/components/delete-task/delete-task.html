<div class="dialog-header">
  <mat-icon class="header-icon warn">delete_outline</mat-icon>
  <h2 mat-dialog-title>Brisanje zadatka</h2>
</div>

<mat-dialog-content class="delete-content">
  <p>Da li ste sigurni da želite da obrišete zadatak <strong>"{{ model().name }}"</strong>?</p>
  <p class="subtext">Ova akcija se ne može poništiti.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="closeDelete()">Otkaži</button>
  <button mat-raised-button color="warn" (click)="confirmDelete()">Obriši</button>
</mat-dialog-actions>
