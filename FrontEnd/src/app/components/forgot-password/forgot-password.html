<div class="login-container">
  <div class="login-card">
    <div class="brand">
      <mat-icon class="brand-icon">vpn_key</mat-icon>
      <h1>Task Manager</h1>
    </div>
    <p class="subtitle">Unesite email ili korisničko ime za koje želite reset lozinke</p>

    @if (!submitted()) {
    <form (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email ili korisničko ime</mat-label>
        <mat-icon matPrefix>mail_outline</mat-icon>
        <input matInput type="text" [ngModel]="usernameOrEmail()" (ngModelChange)="usernameOrEmail.set($event)"
          name="usernameOrEmail" required />
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="loading()" class="submit-btn">
        @if (loading()) {
        <span>Slanje zahteva...</span>
        } @else {
        <span>Pošalji zahtev</span>
        }
      </button>
    </form>
    } @else {
    <p class="confirmation-text">
      Ako nalog postoji, administrator je obavešten o zahtevu i uskoro će vam dostaviti novu lozinku.
    </p>
    }

    <p class="register-link">
      <a routerLink="/login">Nazad na prijavu</a>
    </p>
  </div>
</div>
