<div class="register-container">
  <div class="register-card">
    <div class="brand">
      <mat-icon class="brand-icon">task_alt</mat-icon>
      <h1>Task Manager</h1>
    </div>

    <p class="subtitle">Kreirajte nalog da nastavite</p>

    <form (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Puno ime</mat-label>
        <mat-icon matPrefix>person_outline</mat-icon>

        <input matInput type="text" [ngModel]="fullName()" (ngModelChange)="fullName.set($event)" name="fullName"
          required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>mail_outline</mat-icon>

        <input matInput type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Lozinka</mat-label>
        <mat-icon matPrefix>lock_outline</mat-icon>

        <input matInput type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password"
          required />
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="loading()" class="submit-btn">
        @if (loading()) {
        <span>Registrovanje...</span>
        } @else {
        <span>Registrujte se</span>
        }
      </button>
    </form>

    <p class="login-link">
      Već imate nalog?
      <a routerLink="/login">Prijavite se</a>
    </p>
  </div>
</div>
