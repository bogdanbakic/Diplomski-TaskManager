<div class="dialog-header">
  <mat-icon class="header-icon">vpn_key</mat-icon>
  <h2 mat-dialog-title>Resetuj lozinku</h2>
</div>

<mat-dialog-content class="reset-content">
  <p>Nova lozinka za korisnika <strong>{{ data.fullName }}</strong></p>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Nova lozinka</mat-label>
    <input matInput type="password" [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Otkaži</button>
  <button mat-raised-button color="primary" (click)="confirm()">Potvrdi</button>
</mat-dialog-actions>
