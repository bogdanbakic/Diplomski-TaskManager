<div class="dialog-header">
  <mat-icon class="header-icon warn">logout</mat-icon>
  <h2 mat-dialog-title>Potvrda odjave</h2>
</div>

<mat-dialog-content class="logout-content">
  <p>Da li ste sigurni da želite da se odjavite?</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Otkaži</button>
  <button mat-raised-button color="warn" (click)="confirm()">Odjavi se</button>
</mat-dialog-actions>
